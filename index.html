<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historinhas — vídeos</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font-family: Arial, sans-serif; }
  header { padding: 12px 16px; font-size: 18px; }
  main { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 8px 0 32px; }
  figure { margin: 0; text-align: center; }
  video { height: calc(100vh - 110px); max-width: 100vw; aspect-ratio: 9 / 16; background: #000; }
  figcaption { margin-top: 8px; font-size: 15px; }
</style>
</head>
<body>
<header>Historinhas — vídeos (9:16)</header>
<main>
  <figure>
    <video src="videos/episodio1-nesta-cidade.mp4" controls playsinline preload="metadata"></video>
    <figcaption>Episódio 1 — Nesta cidade, as sombras chegam atrasadas</figcaption>
  </figure>
</main>
</body>
</html>
