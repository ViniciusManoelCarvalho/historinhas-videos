name: Deploy player page

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "videos/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Render videos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect site files
        run: mkdir -p _site && cp index.html _site/ && cp -r videos _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
