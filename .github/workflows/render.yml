name: Render videos

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install font (same as the reviewed render)
        run: sudo apt-get update && sudo apt-get install -y fonts-urw-base35
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless browser
        run: npx remotion browser ensure
      - name: Render episode 1
        run: npx remotion render src/index.ts Episodio1 videos/episodio1-nesta-cidade.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add videos/episodio1-nesta-cidade.mp4
          git commit -m "Render episodio 1" || echo "No changes"
          git push
